services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: venora-frontend:local
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    volumes:
      # Bind mount: serve the frontend files directly from the host during development.
      - type: bind
        source: ./frontend
        target: /usr/share/nginx/html
        read_only: true
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: venora-backend:local
    environment:
      DB_HOST: database
      DB_NAME: ${DB_NAME:-venora}
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASS: ${DB_PASS:?Set DB_PASS in .env}
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  database:
    build:
      context: ./database
      dockerfile: Dockerfile
    image: venora-database:local
    environment:
      MYSQL_DATABASE: ${DB_NAME:-venora}
      MYSQL_USER: ${DB_USER:?Set DB_USER in .env}
      MYSQL_PASSWORD: ${DB_PASS:?Set DB_PASS in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      # Named volume: persists MySQL data even when containers are recreated.
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping --host=127.0.0.1 --user=root --password="$${MYSQL_ROOT_PASSWORD}" --silent'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  db_data:
    name: venora_db_data
