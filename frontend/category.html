
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Collection | VENORA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=Lato:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/extra.css">

  <style>
    /* تنسيق الكارت + أنيميشن الإضاءة + شريط السلة */
    .s-viewport { overflow: visible; clip-path: inset(-44px -14px); }
    .slide { position: relative; cursor: pointer; transition: transform .4s cubic-bezier(.2, .8, .2, 1), box-shadow .4s ease, border-color .4s ease; }
    .slide img { transition: filter .5s ease; }
    .slide:hover, .slide.active { transform: translateY(-10px); border-color: var(--gold); box-shadow: 0 0 0 1px rgba(201,164,92,.45), 0 22px 44px rgba(0,0,0,.5), 0 0 36px rgba(201,164,92,.28); }
    .slide:hover img, .slide.active img { filter: brightness(1.07) saturate(1.05); }
    .slide:active { transform: translateY(-4px) scale(.992); }

    .slide-info { padding: 20px 22px 24px; }
    .slide-info h3 { font-size: 21px; letter-spacing: .3px; }
    .slide-desc { margin-top: 8px; font-size: 12.5px; }
    .price { margin-top: 14px; font-family: 'Playfair Display', serif; font-size: 22px; font-style: italic; letter-spacing: .5px; color: var(--gold-light); }
    .price::before { display: none; }
    .price small { margin-left: 6px; font-family: 'Lato', sans-serif; font-style: normal; font-size: 10px; letter-spacing: 2.5px; color: var(--gold); }
    .add-btn { display: inline-flex; align-items: center; gap: 10px; width: auto; margin: 16px auto 0; padding: 11px 30px; border: 1px solid var(--gold); border-radius: 999px; background: transparent; color: var(--gold-light); font-size: 11px; font-weight: 400; letter-spacing: 3px; transition: background .3s, color .3s, box-shadow .3s; }
    .add-btn::before { content: "+"; font-size: 16px; line-height: 1; margin-top: -1px; }
    .add-btn:hover { background: var(--gold); color: var(--green); box-shadow: 0 0 18px rgba(201,164,92,.4); }

    .cart-bar { position: fixed; left: 50%; bottom: 24px; z-index: 90; width: min(640px, 92vw); display: flex; justify-content: space-between; align-items: center; padding: 16px 26px; background: var(--gold); color: var(--green); font-size: 12px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; transform: translate(-50%, 140%); transition: transform .45s cubic-bezier(.4, 0, .2, 1); box-shadow: 0 12px 30px rgba(0,0,0,.35); }
    .cart-bar.show { transform: translate(-50%, 0); }
    .cart-bar.pop { animation: pop .35s ease; }
    @keyframes pop { 50% { transform: translate(-50%, -6px); } }
    .cart-bar .bar-link { border-bottom: 1px solid var(--green); padding-bottom: 2px; }
  </style>
</head>

<body>
  <div id="site-header"></div>

  <main class="collection">
    <h1 id="title">The Collection</h1>

    <div class="slider" id="slider">
      <button class="arrow" id="prev" type="button" aria-label="Previous">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>

      <div class="s-viewport">
        <div class="s-track" id="track">
          <p class="muted">Loading...</p>
        </div>
      </div>

      <button class="arrow" id="next" type="button" aria-label="Next">
        <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
  </main>

  <div id="site-footer"></div>

  <a class="cart-bar" id="cartBar" href="cart.html" aria-label="View cart">
    <span id="barCount"></span>
    <span id="barTotal"></span>
    <span class="bar-link">View cart</span>
  </a>

  <script src="js/layout.js"></script>
  <script src="js/auth.js"></script>

  <script>
    // ---------- Basic settings ----------
    const API = 'api/';
    const CURRENCY = 'EGP';

    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[c]));

    const money = n =>
      Number(n).toLocaleString(undefined, {
        maximumFractionDigits: 2
      }) + ' ' + CURRENCY;

    // ---------- Page elements ----------
    const slider = document.getElementById('slider');
    const track = document.getElementById('track');
    const prev = document.getElementById('prev');
    const next = document.getElementById('next');
    const bar = document.getElementById('cartBar');

    let index = 0, count = 0;

    // ---------- Slider ----------
    const perView = () =>
      parseInt(getComputedStyle(slider).getPropertyValue('--per-view')) || 3;

    const maxIndex = () => Math.max(0, count - perView());

    function update() {
      index = Math.min(index, maxIndex());

      const first = track.querySelector('.slide');

      if (first) {
        const gap = parseFloat(getComputedStyle(track).columnGap) || 0;

        track.style.transform =
          'translateX(' + (-index * (first.offsetWidth + gap)) + 'px)';
      }

      prev.disabled = index <= 0;
      next.disabled = index >= maxIndex();

      const hide = count <= perView();

      prev.style.visibility = next.style.visibility =
        hide ? 'hidden' : 'visible';
    }

    prev.addEventListener('click', () => {
      index = Math.max(0, index - 1);
      update();
    });

    next.addEventListener('click', () => {
      index = Math.min(maxIndex(), index + 1);
      update();
    });

    window.addEventListener('resize', update);

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') prev.click();
      if (e.key === 'ArrowRight') next.click();
    });

    // ---------- Distribute products between categories ----------
    function interleave(list) {
      const groups = new Map();

      list.forEach(p => {
        if (!groups.has(p.category_id)) {
          groups.set(p.category_id, []);
        }

        groups.get(p.category_id).push(p);
      });

      const queues = [...groups.values()];
      const out = [];

      while (queues.some(q => q.length)) {
        queues.forEach(q => {
          if (q.length) out.push(q.shift());
        });
      }

      return out;
    }

    // ---------- Load products ----------
    async function load() {
      const id = new URLSearchParams(location.search).get('id');

      try {
        const cats = await (await fetch(API + 'categories.php')).json();

        const catById = pid =>
          cats.find(c => String(c.category_id) === String(pid)) || {};

        let url = API + 'products.php';

        if (id) {
          const cat = cats.find(c => String(c.category_id) === id);

          if (!cat) {
            track.innerHTML =
              '<p class="muted">Category not found.</p>';
            return;
          }

          document.title = cat.category_name + ' | VENORA';

          document.getElementById('title').textContent =
            'The ' + cat.category_name + ' Collection';

          url += '?category_id=' + encodeURIComponent(id);

        } else {
          document.title = 'Collection | VENORA';
          document.getElementById('title').textContent =
            'The Collection';
        }

        let products = await (await fetch(url)).json();

        if (!id) {
          products = interleave(products);
        }

        count = products.length;

        if (!count) {
          track.innerHTML = '<p class="muted">No products yet.</p>';
          update();
          return;
        }

        track.innerHTML = products.map(p => {
          const name =
            p.product_name || p.name || p.title ||
            ('Product #' + p.product_id);

          const img =
            p.image_url || p.image || p.img ||
            catById(p.category_id).image_url || '';

          return `
            <article class="slide">
              <img src="${esc(img)}" alt="${esc(name)}">

              <div class="slide-info">
                <h3>${esc(name)}</h3>

                <p class="slide-desc">
                  ${esc(p.description || p.desc || '')}
                </p>

                <span class="price">
                  ${p.price != null
                    ? Number(p.price).toLocaleString(undefined, {
                        maximumFractionDigits: 2
                      }) + '<small>' + CURRENCY + '</small>'
                    : ''}
                </span>

                <button class="add-btn" type="button" data-cart-add
                  data-id="${p.product_id}"
                  data-name="${esc(name)}"
                  data-price="${p.price}"
                  data-image="${esc(img)}">
                  Add to cart
                </button>
              </div>
            </article>
          `;
        }).join('');

        update();

      } catch (err) {
        console.error('Products loading error:', err);
        track.innerHTML =
          '<p class="muted">Could not load products.</p>';
      }
    }

    // ---------- Cart: MySQL API ----------

    async function refreshCart(pulse = false) {
      try {
        const res = await fetch(API + 'cart.php?action=summary', {
          credentials: 'include'
        });

       const responseText = await res.text();

console.log("Status:", res.status);
console.log("Server Response:", responseText);

const data = JSON.parse(responseText);

        if (!res.ok) {
          console.error('Cart summary error:', data.error);
          return;
        }

        const n = Number(data.count || 0);
        const total = Number(data.total || 0);

        // Update header cart badge
        const icon = document.querySelector(
          '.icons a[href="cart.html"]'
        );

        if (icon) {
          let badge = icon.querySelector('.cart-badge');

          if (!n) {
            if (badge) badge.remove();

          } else {
            if (!badge) {
              badge = document.createElement('span');
              badge.className = 'cart-badge';
              icon.appendChild(badge);
            }

            badge.textContent = n;
          }
        }

        // Update bottom cart bar
        if (!n) {
          bar.classList.remove('show');
          return;
        }

        document.getElementById('barCount').textContent =
          n + (n === 1 ? ' item' : ' items');

        document.getElementById('barTotal').textContent =
          money(total);

        bar.classList.add('show');

        if (pulse) {
          bar.classList.remove('pop');
          void bar.offsetWidth;
          bar.classList.add('pop');
        }

      } catch (err) {
        console.error('Could not load cart summary:', err);
      }
    }

    // ---------- Add to Cart ----------
    track.addEventListener('click', async e => {

      const card = e.target.closest('.slide');

      if (card) {
        track.querySelectorAll('.slide.active')
          .forEach(s => s.classList.remove('active'));

        card.classList.add('active');
      }

      const btn = e.target.closest('[data-cart-add]');

      if (!btn) return;

      const productId = Number(btn.dataset.id);

      if (!productId) {
        alert('Invalid product.');
        return;
      }

      btn.disabled = true;

      try {
        const res = await fetch(API + 'cart.php?action=add', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          credentials: 'include',
          body: JSON.stringify({
            product_id: productId,
            quantity: 1
          })
        });

        const data = await res.json();

        if (!res.ok) {
          if (res.status === 401) {
            alert('Please log in first.');
            window.location.href = 'login.html';
            return;
          }

          throw new Error(
            data.error || 'Could not add product.'
          );
        }

        await refreshCart(true);

        alert('Product added to cart!');

      } catch (err) {
        console.error('Add to cart error:', err);
        alert(err.message || 'Could not connect to server.');

      } finally {
        btn.disabled = false;
      }
    });

    // ---------- Initial loading ----------
    refreshCart();

    // Keep the badge updated after header loads
    setTimeout(() => refreshCart(false), 600);
    setTimeout(() => refreshCart(false), 1600);

    // Load products
    load();

  </script>

  <script src="js/auth.js"></script>
</body>
</html>
